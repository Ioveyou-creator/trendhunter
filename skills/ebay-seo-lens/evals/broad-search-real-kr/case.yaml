expected_outcome: |
  실제 eBay 한국어 모바일 화면(2026-11-02)을 옮겨 적은 데이터. 리스팅 24개 = 팔림 16 + 안 팔림 8, 가격은 원화. 검색어가 "pokemon"이라 카드 한 장, 인형, 등급 카드, 스티커가 섞여 있어 같은 상품의 답안지가 아니다. 좋은 답은 원화로 집계하고, 상품이 섞여 있어 핵심 변수를 확정할 수 없다고 밝히고, 입찰 수나 "베스트 오퍼 수락됨"처럼 팔린 결과로 생기는 값은 원인 후보에서 뺀다. 경매 형식, 해외 발송지 같은 관찰은 같은 상품으로 다시 모을 때 확인할 가설로만 남기고, 구체적인 검색어로 다시 모으라고 안내한다.
