expected_outcome: |
  팔림 9개, 안 팔림 9개. 팔린 리스팅은 모두 무료 배송이고 상품가 $95~99, 안 팔린 리스팅은 상품가 $90~94에 배송비 $15라 총액은 $105~109로 더 높다. 무료 배송 여부와 총액이 완전히 겹쳐 있어 둘을 구분할 수 없다는 점을 짚어야 한다. 좋은 답은 배송비를 상품가에 포함해 무료 배송으로 표시하되 총액을 팔린 리스팅 수준(약 $95~99)으로 맞추라는 식으로, 겹침을 인정하면서 실행 가능한 하나를 제시한다. 제목 키워드는 두 그룹이 같아 핵심 변수가 아니다.
