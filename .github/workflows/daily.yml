# 매일 아침 트렌드를 수집해 docs/data 를 갱신하고 저장소에 커밋한다.
# GitHub Pages(docs 폴더)가 이 데이터를 읽어 대시보드를 보여준다.
#
# - 자동 실행: 매일 22:17 UTC = 한국 시간 오전 7:17
#   (정각은 GitHub 서버가 붐벼서 지연되기 쉬워 17분으로 설정)
# - 수동 실행: 저장소 → Actions → "Daily trend update" → Run workflow

name: Daily trend update

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

# 결과를 저장소에 커밋하려면 쓰기 권한이 필요
permissions:
  contents: write

# 같은 작업이 겹쳐 실행되지 않게
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 테스트 (실패하면 수집하지 않음)
        run: python -m unittest discover tests -v

      - name: 수집 + 점수화 + 급상승 추적
        run: python -m src.run_all

      - name: 수집 결과 요약 (Actions 화면에 표시)
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("docs/data/latest.json", encoding="utf-8"))
          print(f"## {d.get('date')} 수집 결과\n")
          print("| 소스 | 상태 | 개수 |\n|---|---|---|")
          for k, s in d["sources"].items():
              state = "OK" if s["ok"] else f"실패: {s['error']}"
              print(f"| {k} | {state} | {s['count']} |")
          h = d.get("history", {})
          print(f"\n후보 {len(d['candidates'])}개, 새로 등장 {h.get('new_count', 0)}개\n")
          print("| 순위 | 점수 | 후보 |\n|---|---|---|")
          for i, c in enumerate(d["candidates"][:10], 1):
              mark = "NEW " if c.get("trend", {}).get("status") == "new" else ""
              print(f"| {i} | {c['score']} | {mark}{c['title'][:60]} |")
          EOF

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "trendhunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +%F) 자동 수집"
          # 그 사이 사람이 push 했을 수 있으니 최신 상태 위에 올린다
          git pull --rebase --autostash
          git push
