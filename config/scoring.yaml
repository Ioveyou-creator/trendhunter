# 상품과 거리가 먼 신호: 있으면 감점
negative_hints:
  - "\\[?routine help\\]?|\\[acne\\]|\\[selfie|b&a|before and after"
  - "\\bhelp\\b|advice|question|which one|\\?$"
  - "trailer|overview|patch|update"
  - "statement|sentencing|health issues|dating|rumou?r"
  - "free talk|making friends|anything goes|share your"

# eBay 검색어를 만들 때 지우는 단어 (Reddit 제목은 문장이라 핵심어만 남긴다)
stopwords: >
  a an the and or but of to in on at for from with by is are was were be been it its this that these those
  i me my we our you your he she they them his her their just so very really finally today lately got get
  have has had do does did can could would should will what when where who how why not no yes all any some
  more most about after before again into out up down over than then there here new one two first
  look looking found decided some another post posts thing things guys sub r day good bam lol
  daughter son wife husband mom dad friend regular clutch coming came went walked think &
