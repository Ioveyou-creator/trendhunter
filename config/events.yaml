# 이벤트 캘린더
# "날짜가 정해진 붐"을 미리 잡기 위한 목록. 직접 추가/수정해서 쓴다.
#
# 항목 공통 필드
#   name       이벤트 이름
#   category   season | kpop | tcg | game | etc
#   keywords   관련 검색어 (4단계에서 다른 신호와 매칭, eBay 검색 링크 생성에 사용)
#   lead_days  며칠 전부터 준비해야 하는지 (소싱 + 리스팅 + 배송). 없으면 default_lead_days
#   note       메모 (선택)
#   source     출처 링크 (일회성 일정은 꼭 적기)

lookahead_days: 60        # 오늘부터 며칠 뒤까지 보여줄지
default_lead_days: 21     # 기본 준비 기간 (한국 → 미국 배송 7~14일 + 소싱·리스팅)
shipping_days: 10         # 이벤트까지 이보다 적게 남으면 "배송 시간 부족" 경고

# 1) 매년 같은 날짜: date = "MM-DD"
yearly:
  - name: Halloween
    category: season
    date: "10-31"
    keywords: [halloween costume, halloween decor]
  - name: Singles' Day (11.11)
    category: season
    date: "11-11"
    keywords: [singles day sale]
    lead_days: 14
  - name: Christmas
    category: season
    date: "12-25"
    keywords: [christmas gift, stocking stuffer]
    lead_days: 30
    note: 미국 USPS 국제우편 연말 마감이 빨라서 여유 있게 준비
  - name: Valentine's Day
    category: season
    date: "02-14"
    keywords: [valentines gift]

# 2) 매년 날짜가 바뀌는 이벤트: N번째 요일 + 보정일
#    weekday: mon tue wed thu fri sat sun / n: 1~5 / offset_days: 이후 며칠
nth_weekday:
  - name: Black Friday
    category: season
    month: 11
    n: 4
    weekday: thu       # 추수감사절(11월 넷째 목요일)
    offset_days: 1     # 다음 날
    keywords: [black friday deals]
    lead_days: 28
  - name: Cyber Monday
    category: season
    month: 11
    n: 4
    weekday: thu
    offset_days: 4
    keywords: [cyber monday deals]
    lead_days: 28
  - name: Mother's Day (US)
    category: season
    month: 5
    n: 2
    weekday: sun
    keywords: [mothers day gift]

